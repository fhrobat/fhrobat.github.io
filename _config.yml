title: Francesco Hrobat # name of the site
author: Francesco Hrobat # name of site's author
email: francesco.hrobat@maths.ox.ac.uk # email of site's author
url:  "https://fhrobat.github.io" # root address of the site
scholar: "https://scholar.google.com/citations?hl=en&user=sB-MFsYAAAAJ"
baseurl: "" # subpath of the site, e.g. "/blog" (leave it blank "" if your site shouldn't use a subpath)
locale: en_GB
# plain text, used by search engines and link previews
description: >-
  Francesco Hrobat, Mathematics PhD student at the University of Oxford
  working on numerical linear algebra: perturbation theory, randomized
  linear algebra and Krylov methods.
# contacts and short bio shown at the top of the home page
bio: >
  <p class="contacts">
   <a href="mailto:francesco.hrobat@maths.ox.ac.uk">Email</a>
   <a href="https://github.com/fhrobat/" target="_blank" rel="noopener">GitHub</a>
   <a href="https://scholar.google.com/citations?hl=en&user=sB-MFsYAAAAJ" target="_blank" rel="noopener">Google Scholar</a>
   <a href="https://arxiv.org/search/?searchtype=author&query=Hrobat%2C+F" target="_blank" rel="noopener">arXiv</a>
   <a href="https://www.linkedin.com/in/francesco-hrobat" target="_blank" rel="noopener">LinkedIn</a>
   <a href="https://orcid.org/0009-0002-5304-8107" target="_blank" rel="noopener">ORCID</a>
  </p>
  <div class="row">
    <div class="column column--photo reveal">
      <picture>
        <source type="image/webp" srcset="hrobat-300.webp 300w, hrobat-600.webp 600w" sizes="(max-width: 720px) 180px, 300px">
        <img src="hrobat.jpg" class="img-portrait" alt="Francesco Hrobat, portrait" width="600" height="600">
      </picture>
    </div>

    <div class="column">
      <div class="column-inner reveal cascade">
        <p>
        I am a Mathematics PhD student at the <strong>University of Oxford</strong>, St Catherine's College (previously Linacre College), supported by the Mathematical Institute Scholarship and by the College Scholarship in Sciences of St Catherine's College.
        </p>
        <p>
        My research focuses on <strong>numerical linear algebra</strong>, including perturbation theory, randomized linear algebra and Krylov methods.
        </p>
      </div>
    </div>
  </div>

# profiles listed in the structured data for search engines
social:
  name: Francesco Hrobat
  links:
    - https://github.com/fhrobat
    - https://scholar.google.com/citations?user=sB-MFsYAAAAJ
    - https://orcid.org/0009-0002-5304-8107
    - https://www.linkedin.com/in/francesco-hrobat

# portrait used as the preview image when the site is shared
defaults:
  - scope:
      path: ""
    values:
      image: /hrobat.jpg

permalink: /:slug.html

favicon: "favicon.svg" # name+extension of favicon (which must be put on the root folder)
goat_counter: "fhrobat" # put your GoatCounter name if you want to use GoatCounter analytics

theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  back_home_text: "Home" # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: true # show blog description in home page
  lowercase_titles: false # show titles in lowercase in lists

sass:
  style: compressed
  sourcemap: never
  sass_dir: _sass

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jektex

# repository files that are not part of the site (Jekyll's own defaults repeated,
# as Jekyll 3, still used by the classic Pages build, replaces them with this list)
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - no-style-please.gemspec
  - radar/
  - LICENSE.txt
  - README.md
  - MANUTENZIONE.md

jektex:
  cache_dir: ".jektex-cache"
  ignore: ["*.xml"]
  silent: false
  macros:
    - ["\\Q", "\\mathbb{Q}"]
    - ["\\C", "\\mathbb{C}"]
