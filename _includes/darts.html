<!--
  Darts sul sito: il gioco (React + three.js, impacchettato in un solo file da app/, vedi app/build.sh) gira in un
  iframe creato al primo click sulla scheda. Per ora niente classifiche: il record del count-up resta nel browser
  di chi gioca. Il gioco manda già a questa pagina { type: 'darts', event: 'start' | 'end', mode, score, won, darts }.
  Niente dollari né barre rovesciate con parentesi: sul sito KaTeX passa su tutto l'HTML.
-->
<style>
  #darts[hidden] { display: none; }
  #darts { width: 100%; max-width: 760px; margin: 28px auto 60px; font-family: 'Courier New', monospace; text-align: left; }
  #darts-stage { position: relative; width: 100%; aspect-ratio: 16 / 10; border: 1px solid currentColor; border-radius: 10px; overflow: hidden; background: #fdfbf6; }
  @media (max-width: 600px) and (orientation: portrait) { #darts-stage { aspect-ratio: 3 / 4; } }
  #darts-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>

<!-- si apre dalla sua scheda in minigames.html -->
<div id="darts" hidden>
  <div class="mg-bar"><span class="mg-bar-title">Darts</span><button type="button" class="mg-close" aria-label="Close Darts">Close &#x2715;</button></div>
  <div id="darts-stage"></div>
</div>

<script>
minigame('darts', dartsStart);

function dartsStart() {
  const box = document.getElementById('darts'), stage = document.getElementById('darts-stage');
  let frame = null;
  function open() {
    if (frame) return;
    frame = document.createElement('iframe');
    frame.id = 'darts-frame';
    frame.title = 'Darts';
    frame.src = '{{ '/assets/games/darts.html' | relative_url }}?v=af4e45dd';
    frame.allow = 'fullscreen';
    // il sito rimette dritti gli iframe nel tema scuro; questo no, così si inverte come il resto
    frame.style.filter = 'none';
    frame.addEventListener('load', () => { try { frame.contentWindow.focus(); } catch (e) {} });
    stage.appendChild(frame);
  }
  open();
  // riaperta la scheda dopo una chiusura, il gioco torna (dalla schermata iniziale)
  document.getElementById('darts-open').addEventListener('click', () => { if (!box.hidden) open(); });
  // chiudendo si butta via l'iframe, così il disegno 3D si ferma
  return { close() { if (frame) { frame.remove(); frame = null; } } };
}
</script>
