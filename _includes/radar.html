<section class="radar reveal st" id="radar" aria-labelledby="radar-title"
  data-src="https://raw.githubusercontent.com/fhrobat/fhrobat.github.io/radar-data/radar.json"
  data-mask="assets/timeline/land.png">
  <span class="mk" data-k="radar" aria-hidden="true"></span>

    <h2 class="rd-title" id="radar-title">NLA radar</h2>
