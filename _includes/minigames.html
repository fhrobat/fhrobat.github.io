<!--
  Le schede dei minigiochi in fondo alla home: un titolo e una scheda illustrata per ogni gioco.
  Ogni gioco parte solo al primo clic sulla sua scheda (la home resta leggera); se ne tiene aperto
  uno alla volta e si chiude col suo pulsante Close o ricliccando la scheda.
  Va incluso prima dei giochi (foosball.html, kart.html), che si registrano con minigame(id, start).
-->
<style>
  #mg {
    text-align: center;
    margin: 48px auto 28px;
    font-family: 'Courier New', monospace;
  }
  #mg-title { font-size: 0.95rem; letter-spacing: 0.03em; margin: 0 0 0.9rem; }
  #mg-cards { display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem; }
  .mg-card {
    width: min(190px, calc(50vw - 28px));
    box-sizing: border-box;
    font: inherit;
    color: inherit;
    background: none;
    border: 1px solid currentColor;
    padding: 0.7rem 0.6rem 0.65rem;
    cursor: pointer;
    transition: transform 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  .mg-card svg { display: block; width: 100%; height: auto; }
  .mg-card:hover, .mg-card:focus-visible { transform: translateY(-3px); }
  .mg-card:hover .mg-name, .mg-card:focus-visible .mg-name { text-decoration: underline; }
  .mg-card:focus-visible { outline: 2px solid #0b47d1; outline-offset: 2px; }
  .mg-card[aria-expanded="true"] { border-width: 2px; padding: calc(0.7rem - 1px) calc(0.6rem - 1px) calc(0.65rem - 1px); }
  .mg-name { display: block; font-weight: bold; font-size: 0.95rem; margin-top: 0.45rem; }
  .mg-sub { display: block; font-size: 0.72rem; opacity: 0.7; margin-top: 0.15rem; }
  /* piccole animazioni passandoci sopra: la pallina rotola, il kart sobbalza e fa scintille */
  .mg-ball, .mg-kart, .mg-spark { transform-box: fill-box; transform-origin: center; }
  .mg-spark { opacity: 0; }
  .mg-card:hover .mg-ball, .mg-card:focus-visible .mg-ball { animation: mg-roll 0.9s ease-in-out infinite alternate; }
  .mg-card:hover .mg-kart, .mg-card:focus-visible .mg-kart { animation: mg-hop 0.5s ease-in-out infinite alternate; }
  .mg-card:hover .mg-spark, .mg-card:focus-visible .mg-spark { animation: mg-spark 0.18s steps(2) infinite; }
  @keyframes mg-roll { from { transform: translate(0, 0); } to { transform: translate(-34px, 12px); } }
  @keyframes mg-hop { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }
  @keyframes mg-spark { from { opacity: 0.25; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .mg-card, .mg-card:hover { transition: none; transform: none; }
    .mg-card .mg-ball, .mg-card .mg-kart { animation: none !important; }
    .mg-card:hover .mg-spark { animation: none; opacity: 1; }
  }
  /* la barra in cima a ogni gioco, col pulsante per chiuderlo */
  .mg-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
  }
  .mg-bar-title { font-weight: bold; }
  .mg-close {
    font: inherit;
    color: inherit;
    background: none;
    border: 1px solid currentColor;
    padding: 0.15em 0.7em;
    cursor: pointer;
  }
  .mg-close:hover { text-decoration: underline; }
  .mg-close:focus-visible { outline: 2px solid #0b47d1; outline-offset: 2px; }
  /* dark mode del sito: come per i giochi, il blu resta blu */
  body[a="dark"] #mg { filter: hue-rotate(180deg); }
  @media (prefers-color-scheme: dark) {
    body[a="auto"] #mg { filter: hue-rotate(180deg); }
  }
</style>

<div id="mg">
  <p id="mg-title">Challenge me at these minigames</p>
  <div id="mg-cards">
    <button type="button" class="mg-card" id="foos-open" aria-expanded="false" aria-controls="foos">
      <svg viewBox="0 0 160 100" aria-hidden="true">
        <!-- tavolo del subotto visto dall'alto -->
        <rect x="16" y="14" width="128" height="72" rx="5" fill="#fff" stroke="#000" stroke-width="2.5"/>
        <rect x="9" y="38" width="7" height="24" fill="#fff" stroke="#000" stroke-width="2"/>
        <rect x="144" y="38" width="7" height="24" fill="#fff" stroke="#000" stroke-width="2"/>
        <line x1="80" y1="14" x2="80" y2="86" stroke="#000" stroke-width="1"/>
        <circle cx="80" cy="50" r="11" fill="none" stroke="#000" stroke-width="1"/>
        <g stroke="#9a9a9a" stroke-width="2">
          <line x1="36" y1="4" x2="36" y2="96"/><line x1="60" y1="4" x2="60" y2="96"/>
          <line x1="100" y1="4" x2="100" y2="96"/><line x1="124" y1="4" x2="124" y2="96"/>
        </g>
        <g fill="#000">
          <rect x="32" y="28" width="8" height="14" rx="3"/><rect x="32" y="58" width="8" height="14" rx="3"/>
          <rect x="96" y="22" width="8" height="14" rx="3"/><rect x="96" y="43" width="8" height="14" rx="3"/><rect x="96" y="64" width="8" height="14" rx="3"/>
        </g>
        <g fill="#0b47d1">
          <rect x="56" y="22" width="8" height="14" rx="3"/><rect x="56" y="43" width="8" height="14" rx="3"/><rect x="56" y="64" width="8" height="14" rx="3"/>
          <rect x="120" y="28" width="8" height="14" rx="3"/><rect x="120" y="58" width="8" height="14" rx="3"/>
        </g>
        <circle class="mg-ball" cx="88" cy="40" r="4.2" fill="#fff" stroke="#000" stroke-width="1.8"/>
      </svg>
      <span class="mg-name">Foosball</span>
      <span class="mg-sub">you can play before 6pm here</span>
    </button>
    <button type="button" class="mg-card" id="kart-open" aria-expanded="false" aria-controls="kart">
      <svg viewBox="0 0 160 100" aria-hidden="true">
        <!-- la pista vista da dietro il kart -->
        <path d="M0 47 Q22 33 46 41 T96 37 T160 43 V50 H0 Z" fill="#c9d4f2"/>
        <rect x="0" y="47" width="160" height="53" fill="#ececec"/>
        <g fill="#8a8a8a"><path d="M18 47 l5 -12 l5 12 Z"/><path d="M30 47 l4 -9 l4 9 Z"/><path d="M124 47 l5 -13 l5 13 Z"/><path d="M136 47 l4 -9 l4 9 Z"/></g>
        <polygon points="66,47 94,47 152,100 8,100" fill="#fff"/>
        <line x1="66" y1="47" x2="8" y2="100" stroke="#000" stroke-width="2"/>
        <line x1="94" y1="47" x2="152" y2="100" stroke="#000" stroke-width="2"/>
        <line x1="63" y1="47" x2="1" y2="100" stroke="#0b47d1" stroke-width="4" stroke-dasharray="6 6"/>
        <line x1="97" y1="47" x2="159" y2="100" stroke="#0b47d1" stroke-width="4" stroke-dasharray="6 6"/>
        <!-- traguardo -->
        <line x1="133" y1="8" x2="133" y2="30" stroke="#000" stroke-width="1.5"/>
        <g fill="#000"><rect x="134" y="8" width="5" height="5"/><rect x="144" y="8" width="5" height="5"/><rect x="139" y="13" width="5" height="5"/><rect x="134" y="18" width="5" height="5"/><rect x="144" y="18" width="5" height="5"/></g>
        <rect x="134" y="8" width="15" height="15" fill="none" stroke="#000" stroke-width="1"/>
        <!-- il kart -->
        <g class="mg-kart">
          <ellipse cx="80" cy="93" rx="30" ry="4" fill="rgba(0,0,0,0.15)"/>
          <rect x="54" y="74" width="13" height="18" rx="2.5" fill="#111"/>
          <rect x="93" y="74" width="13" height="18" rx="2.5" fill="#111"/>
          <rect x="63" y="76" width="34" height="11" rx="3" fill="#2a2a2a"/>
          <rect x="71" y="69" width="18" height="8" rx="1.5" fill="#808080"/>
          <rect x="71" y="56" width="18" height="15" rx="4" fill="#f2f2f2" stroke="#000" stroke-width="1.5"/>
          <circle cx="80" cy="51" r="8.5" fill="#fff" stroke="#000" stroke-width="2"/>
          <rect x="78.8" y="42.5" width="2.4" height="17" fill="#000"/>
        </g>
        <g class="mg-spark" stroke="#0b47d1" stroke-width="2" stroke-linecap="round">
          <path d="M58 92 l-7 -4 M58 92 l-8 2 M58 92 l-4 -8"/>
          <path d="M102 92 l7 -4 M102 92 l8 2 M102 92 l4 -8"/>
        </g>
      </svg>
      <span class="mg-name">Maths Kart</span>
      <span class="mg-sub">race my ghosts</span>
    </button>
  </div>
</div>

<script>
window.minigame = (id, start) => {
  const card = document.getElementById(id + '-open'), box = document.getElementById(id);
  if (!card || !box) return;
  const all = window.minigame.all || (window.minigame.all = []);
  let game = null;
  function open() {
    for (const g of all) if (g !== me) g.close(false);
    box.hidden = false;
    card.setAttribute('aria-expanded', 'true');
    if (!game) game = start() || {};
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const c = box.querySelector('canvas[tabindex]');
    if (c) c.focus({ preventScroll: true });
  }
  function close(back = true) {
    if (box.hidden) return;
    if (game && game.close) game.close();      // esce dallo schermo intero, spegne i suoni, torna all'inizio
    box.hidden = true;
    card.setAttribute('aria-expanded', 'false');
    if (back) {
      document.getElementById('mg').scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.focus({ preventScroll: true });
    }
  }
  const me = { close };
  all.push(me);
  card.addEventListener('click', () => (box.hidden ? open() : close()));
  const x = box.querySelector('.mg-close');
  if (x) x.addEventListener('click', () => close());
};
</script>
