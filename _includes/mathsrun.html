<!--
  Maths Run sul sito: il gioco (React + three.js, impacchettato in un solo file da app/, vedi app/README) gira in un
  iframe creato al primo click sulla scheda. A fine corsa il gioco manda il risultato a questa pagina
  (postMessage { type: 'mathsrun', event: 'start' | 'end', score, dist, solved }), che lo scrive su Firebase:
  ramo "run" dello stesso database del subotto e del kart, con le regole generate da foosball/build_names.py.
  Classifiche: più punti e più lontano, il migliore di ogni giocatore. Il gioco è in beta: c'è un avviso.
  Niente dollari né barre rovesciate con parentesi: sul sito KaTeX passa su tutto l'HTML.
-->
<style>
  #run[hidden] { display: none; }
  #run { width: 100%; max-width: 760px; margin: 28px auto 60px; font-family: 'Courier New', monospace; text-align: left; }
  .mg-beta { display: inline-block; font-size: 0.7rem; font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase;
    border: 1px solid currentColor; border-radius: 999px; padding: 0 0.45em; margin-left: 0.4em; vertical-align: 0.1em; color: #0b47d1; }
  #run-note { font-size: 0.8rem; border: 1px dashed #0b47d1; border-radius: 10px; padding: 0.45rem 0.7rem; margin: 0 0 0.7rem; }
  #run-stage { position: relative; width: 100%; aspect-ratio: 16 / 10; border: 1px solid currentColor; border-radius: 10px; overflow: hidden; background: #fdfbf6; }
  @media (max-width: 600px) and (orientation: portrait) { #run-stage { aspect-ratio: 4 / 5; } }
  /* il gioco si inverte col resto della pagina nel tema scuro (il blu diventa arancione): niente filtro di ritorno */
  #run-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .run-you { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.8rem; margin: 0.7rem 0 0; font-size: 0.85rem; }
  .run-you input { font: inherit; width: 11em; margin-left: 0.4em; padding: 0.15em 0.4em; border: 1px solid currentColor; border-radius: 6px; background: transparent; color: inherit; }
  #run-name-hint { opacity: 0.75; }
  #run-board { margin-top: 1rem; font-size: 0.85rem; }
  #run-board[hidden] { display: none; }
  #run-live { margin: 0 0 0.6rem; }
  .run-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 1.5rem; }
  @media (max-width: 600px) { .run-cols { grid-template-columns: 1fr; } }
  .run-board-title { font-weight: bold; margin: 0 0 0.3rem; }
  #run ol { margin: 0; padding-left: 1.6em; max-width: none; list-style-position: outside; }
  #run ol li { margin: 0.15rem 0; }
  #run ol li.me { color: #0b47d1; font-weight: bold; }
</style>

<!-- si apre dalla sua scheda in minigames.html -->
<div id="run" hidden>
  <div class="mg-bar"><span class="mg-bar-title">Maths Run <span class="mg-beta">beta</span></span><button type="button" class="mg-close" aria-label="Close Maths Run">Close &#x2715;</button></div>
  <p id="run-note"><b>Beta:</b> a brand new game. Things may still change while I tune it, and the leaderboards may be reset. If something looks broken, tell me.</p>
  <div id="run-stage"></div>
  <div class="run-you">
    <label>Your first name<input id="run-name" type="text" maxlength="16" autocomplete="given-name" list="run-names" placeholder="Anonymous"></label>
    <datalist id="run-names"></datalist>
    <span id="run-name-hint"></span>
  </div>
  <div id="run-board" hidden>
    <p id="run-live">Nobody else is running right now.</p>
    <div class="run-cols">
      <div><p class="run-board-title">Most points</p><ol id="run-best-score"></ol></div>
      <div><p class="run-board-title">Furthest</p><ol id="run-best-dist"></ol></div>
    </div>
  </div>
</div>

    const dl = document.getElementById('run-names');

  function ago(ms) {
    const s = Math.max(0, (Date.now() - ms) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.floor(s / 60)} min ago`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ago`;

  function top(list, key) {
    const seen = new Set(), out = [];
    for (const r of list.slice().sort((a, b) => b[key] - a[key] || a.at - b.at)) {
      if (r.name !== 'Anonymous') { if (seen.has(r.name)) continue; seen.add(r.name); }

      if (out.length === 10) break;

    const me = playerName();

      el.textContent = '';

    try {
      const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const { initializeApp } = await import(base + 'firebase-app.js');
      const fdb = await import(base + 'firebase-database.js');

      const db = fdb.getDatabase(initializeApp(FIREBASE_CONFIG, 'run'));
      const myId = 'r' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      const presRef = fdb.ref(db, 'run/presence/' + myId);

        running = true;
        fdb.onDisconnect(presRef).remove();
        fdb.set(presRef, { name: playerName(), since: fdb.serverTimestamp() }).catch(() => {});

        snap.forEach(c => {
          const v = c.val();
          if (c.key === myId || !v) return;
          if (typeof v.since === 'number' && Date.now() - v.since > 30 * 60 * 1000) return;   // sessioni rimaste appese

        });

      });

        const list = [];
        snap.forEach(c => {
          const v = c.val();
          if (!v || typeof v.score !== 'number' || typeof v.dist !== 'number' || typeof v.at !== 'number') return;
          list.push({ name: cleanName(v.name), score: v.score, dist: v.dist, solved: v.solved | 0, at: v.at });

        all = list;
        render();
      });
      elBoard.hidden = false;
    } catch (e) {
      console.warn('Maths Run leaderboard is offline:', e);
    }

  window.addEventListener('message', e => {

    const d = e.data;
    if (d.event === 'start') net.start();
    else if (d.event === 'end') net.end({ score: Math.max(0, Math.round(+d.score || 0)), dist: Math.max(0, Math.round(+d.dist || 0)), solved: Math.max(0, Math.round(+d.solved || 0)) });

  // riaperta la scheda dopo una chiusura, il gioco torna

  return { close: closeGame };
